version: '3'

services:
  bot:
    image: ghcr.io/chasseur-de-succes/cds-bot:master
    restart: always
    networks:
      - bdd
    env_file:
      - .env
      - .bot.env
    depends_on:
      - mongodb
      - postgres
  feed:
    image: ghcr.io/chasseur-de-succes/cds-steam-feed:main
    restart: always
    networks:
      - bdd
    env_file:
      - .env
      - .feed.env
    depends_on:
      - mongodb
      - postgres
  mongodb:
    image: mongo:7.0
    restart: always
    volumes:
      - /opt/cds:/data/db
    networks:
      - bdd
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - /opt/cds-pg:/var/lib/postgresql/data
    networks:
      - bdd

networks:
  bdd:
    driver: bridge
